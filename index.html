<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        
        /* Sidebar Menu */
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; text-align: left; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: block; border-bottom: 1px solid #003366; cursor: pointer; }

        /* UI Elements */
        .league-header { margin-top: 80px; font-size: 26px; font-weight: 900; color: #ffffff; letter-spacing: 1px; }
        #coinCount { font-size: 70px; color: #ffd700; margin-top: 5px; font-weight: bold; }
        
        /* Gold Coin - NO BLUE HIGHLIGHT */
        .coin-wrapper { margin-top: 50px; position: relative; display: inline-block; -webkit-tap-highlight-color: transparent; outline: none; } 
        #clicker { 
            width: 240px; height: 240px; 
            background: radial-gradient(circle, #ffcc33, #cc9900); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 100px; color: #663300; font-weight: bold; 
            border: 10px solid #e6b800; cursor: pointer; 
            box-shadow: 0 0 30px rgba(255,215,0,0.3); transition: transform 0.05s;
            user-select: none; -webkit-user-select: none;
        }
        #clicker:active { transform: scale(0.96); }

        /* Modals */
        .modal { display: none; position: fixed; top: 30%; left: 50%; transform: translate(-50%, -30%); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 1001; border: 2px solid #ffd700; }
        .btn-action { background: #ffd700; color: black; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        
        /* Tap Animation */
        .plus-one { position: absolute; color: #ffd700; font-size: 32px; font-weight: bold; pointer-events: none; animation: floatUp 0.7s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div class="menu-icon" onclick="toggleSidebar()">☰</div>

    <div class="sidebar" id="sidebar">
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Wallet</a>
        <a href="https://t.me/DILIK_officia" target="_blank">📢 Join Channel</a>
        <a onclick="showM('tariffModal')">📊 Tariffs</a>
        <a id="adminBtn" onclick="showM('adminModal')" style="display:none; color:#00ff00;">🛠 Admin Panel</a>
        <a onclick="toggleSidebar()" style="color:#ff4444">❌ Close</a>
    </div>

    <div class="league-header" id="leagueName">BRONZE</div>
    <div id="coinCount">0</div>

    <div class="coin-wrapper" onclick="handleTap(event)">
        <div id="clicker">D</div>
    </div>
    
    <p style="color:#ffd700; margin-top:40px; font-weight: 500;">TAP TO EARN</p>

    <div id="adminModal" class="modal">
        <h2 style="color:#00ff00">ADMIN PANEL</h2>
        <p>Your ID: 5863448768</p>
        <button class="btn-action" onclick="addAdminCoins()">+50,000 Coins</button>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('adminModal')">CLOSE</button>
    </div>

    <div id="walletModal" class="modal">
        <h2 style="color:#ffd700">WALLET</h2>
        <p>Connect your wallet to manage your gold.</p>
        <button class="btn-action" onclick="tg.showAlert('Wallet system connecting...')">Connect Wallet</button>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('walletModal')">BACK</button>
    </div>

    <div id="tariffModal" class="modal">
        <h2 style="color:#ffd700">TARIFF LIMITS</h2>
        <p style="text-align:left; line-height: 1.6;">
            BRONZE: 10,000<br>
            SILVER: 50,000<br>
            GOLD: 100,000<br>
            PLATINUM: 200,000
        </p>
        <button class="btn-action" onclick="closeM('tariffModal')">OK</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const ADMIN_ID = 5863448768;
        const config = { databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const db = firebase.database().ref('users/' + userId);
        
        let coins = 0;

        db.on('value', (s) => {
            const data = s.val();
            coins = data?.coins || 0;
            document.getElementById('coinCount').innerText = coins.toLocaleString();
            
            // League Update
            let l = "BRONZE";
            if(coins >= 10000) l = "SILVER";
            if(coins >= 50000) l = "GOLD";
            if(coins >= 100000) l = "PLATINUM";
            document.getElementById('leagueName').innerText = l;
            
            // 1K check
            document.getElementById('clicker').innerText = coins >= 100 ? "1K" : "D";

            // Admin check
            if (userId == ADMIN_ID) {
                document.getElementById('adminBtn').style.display = 'block';
            }
        });

        function handleTap(e) {
            coins++;
            db.update({coins: coins});
            tg.HapticFeedback.impactOccurred('medium');

            const plus = document.createElement('div');
            plus.innerText = '+1';
            plus.className = 'plus-one';
            plus.style.left = (e.clientX - 10) + 'px';
            plus.style.top = (e.clientY - 40) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 700);
        }

        function addAdminCoins() {
            coins += 50000;
            db.update({coins: coins});
            tg.showAlert("50,000 coins added!");
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { document.getElementById(id).style.display='block'; toggleSidebar(); }
        function closeM(id) { document.getElementById(id).style.display='none'; }

        function invite() {
            const botLink = `https://t.me/Dilik_gold_bot?start=${userId}`;
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=Join%20Dilik%20Gold%20and%20earn!`;
            tg.openTelegramLink(shareUrl);
        }
    </script>
</body>
</html>
