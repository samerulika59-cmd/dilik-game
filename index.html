<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Ultimate</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Anti-blue highlight and layout */
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; outline: none; }
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Clicker UI */
        .click-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #clicker { width: 220px; height: 220px; background: radial-gradient(circle, #ffcc33 0%, #cc9900 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 90px; color: #663300; font-weight: bold; border: 10px solid #e6b800; box-shadow: 0 0 40px rgba(255, 215, 0, 0.2); cursor: pointer; transition: transform 0.05s ease-in-out; position: relative; z-index: 5; }
        #clicker:active { transform: scale(0.92); }

        /* Animation */
        .tap-number { position: absolute; color: #ffd700; font-size: 35px; font-weight: 900; pointer-events: none; animation: moveUp 0.8s ease-out forwards; z-index: 10; }
        @keyframes moveUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }

        /* Sidebar & Modals */
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #00152e; transition: 0.3s; z-index: 1000; border-right: 2px solid #ffd700; padding-top: 50px; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 17px; color: #e0e0e0; display: block; border-bottom: 1px solid #002b5c; cursor: pointer; text-align: left; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #001c3d; padding: 25px; border-radius: 25px; width: 85%; z-index: 1100; border: 2px solid #ffd700; max-height: 80vh; overflow-y: auto; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1050; }

        /* Buttons & Ad Box */
        .btn-gold { background: linear-gradient(180deg, #ffd700, #b8860b); color: #000; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        #ad-banner { display: none; background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 10px; margin: 10px; border-radius: 10px; color: #ffd700; font-weight: bold; }

        .skin-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .skin-box { background: #002b5c; padding: 10px; border-radius: 15px; border: 1px solid #ffd700; }
    </style>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <a onclick="showM('leaderboardModal')">🏆 Top 10 Players</a>
        <a onclick="showM('turboModal')" style="color:#ff4444">🔥 Turbo Mode (10k)</a>
        <a onclick="showM('skinModal')" style="color:#00ff00">🎨 Skin Shop</a>
        <a onclick="showM('upgradeModal')">🚀 Upgrade Tap</a>
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Wallet (TON)</a>
        <a id="adminLink" onclick="showM('adminModal')" style="display:none; color:#00ff00; font-weight:bold;">🛠 Admin Panel</a>
        <a onclick="toggleS()" style="color:#ff4444; margin-top: 20px;">❌ Close</a>
    </div>

    <div class="header-info" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 30px;" onclick="toggleS()">☰</span>
            <span style="background: #ffd700; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold;">PLATINUM LEAGUE</span>
            <span></span>
        </div>
        <div id="ad-banner"></div>
        <div id="balance" style="font-size: 55px; color: #ffd700; font-weight: bold;">0</div>
        <div id="statusText" style="color: #00ff00; font-weight: bold; min-height: 20px;"></div>
    </div>

    <div class="click-area">
        <div id="clicker" onclick="handleTap(event)">D</div>
    </div>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="skinModal" class="modal">
        <h2>🎨 SKIN SHOP</h2>
        <div class="skin-container" id="skinGrid"></div>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">CLOSE</button>
    </div>

    <div id="upgradeModal" class="modal">
        <h2>🚀 UPGRADE TAP</h2>
        <p>Level: <b id="lvlNow">1</b> / 5</p>
        <button id="upBtn" class="btn-gold" onclick="doUpgrade()">UPGRADE</button>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">BACK</button>
    </div>

    <div id="turboModal" class="modal">
        <h2>🔥 TURBO MODE</h2>
        <p>Cost: 10,000 | Effect: +5 per tap | Duration: 1 hour</p>
        <button class="btn-gold" onclick="buyTurbo()">ACTIVATE</button>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">CLOSE</button>
    </div>

    <div id="adminModal" class="modal">
        <h2>🛠 ADMIN PANEL</h2>
        <textarea id="adMsg" placeholder="Type your ad message here..." style="width:100%; height:80px; margin-bottom:10px; border-radius:10px;"></textarea>
        <button class="btn-gold" onclick="sendAd()">📢 SEND AD TO ALL</button>
        <button class="btn-gold" onclick="clearAd()" style="background:#ff4444; color:#fff;">🗑 DELETE AD FROM ALL</button>
        <button class="btn-gold" onclick="add100k()" style="background:#222; color:#00ff00;">+100K TEST COINS</button>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">CLOSE</button>
    </div>

    <div id="walletModal" class="modal">
        <h2>👛 TON WALLET</h2>
        <input type="text" id="walletInput" placeholder="Address UQ..." style="width:100%; padding:10px; margin-bottom:10px;">
        <button class="btn-gold" onclick="saveWallet()">SAVE</button>
        <button class="btn-gold" style="background:#0088cc; color:#fff;" onclick="window.open('https://t.me/wallet')">OPEN WALLET</button>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">BACK</button>
    </div>

    <div id="leaderboardModal" class="modal">
        <h2>🏆 TOP 10 PLAYERS</h2>
        <div id="leaderList" style="text-align: left;"></div>
        <button class="btn-gold" onclick="closeAll()">CLOSE</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 5863448768;
        firebase.initializeApp({ databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" });
        const uId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "local_user";
        const uRef = firebase.database().ref('users/' + uId);
        const globalRef = firebase.database().ref('global_config');

        let data = { coins: 0, tapLvl: 0, turboEnd: 0, activeSkin: "D", ownedSkins: ["D"], wallet: "" };
        const costs = [3000, 8000, 15000, 25000, 45000];
        const skins = [
            {id: "D", p: 0}, {id: "₿", p: 50000}, {id: "💎", p: 100000}, {id: "🥇", p: 25000},
            {id: "🥈", p: 10000}, {id: "🚀", p: 75000}, {id: "🔥", p: 40000}, {id: "🌟", p: 20000},
            {id: "💰", p: 15000}, {id: "👑", p: 90000}, {id: "🍎", p: 30000}, {id: "⚡", p: 55000}
        ];

        uRef.on('value', s => { if(s.val()) { data = {...data, ...s.val()}; updateUI(); } else uRef.set(data); });
        
        // GLOBAL AD LISTENER
        globalRef.on('value', s => {
            const g = s.val();
            const banner = document.getElementById('ad-banner');
            if(g && g.ad_text) { banner.innerText = "📢 " + g.ad_text; banner.style.display = 'block'; }
            else { banner.style.display = 'none'; }
        });

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(data.coins).toLocaleString();
            document.getElementById('clicker').innerText = data.activeSkin;
            document.getElementById('lvlNow').innerText = data.tapLvl + 1;
            if(data.tapLvl < 5) document.getElementById('upBtn').innerText = `UPGRADE (${costs[data.tapLvl].toLocaleString()})`;
            else document.getElementById('upBtn').innerText = "MAX LEVEL";
            if(uId == ADMIN_ID) document.getElementById('adminLink').style.display = 'block';
            renderSkins();
        }

        function handleTap(e) {
            const gain = (1 + data.tapLvl) + (Date.now() < data.turboEnd ? 5 : 0);
            data.coins += gain;
            uRef.update({ coins: data.coins, name: tg.initDataUnsafe.user?.first_name || "User" });
            const n = document.createElement('div'); n.className = 'tap-number'; n.innerText = `+${gain}`;
            n.style.left = `${e.clientX - 20}px`; n.style.top = `${e.clientY - 40}px`;
            document.body.appendChild(n); setTimeout(() => n.remove(), 800);
            tg.HapticFeedback.impactOccurred('light');
        }

        function doUpgrade() {
            if(data.tapLvl < 5 && data.coins >= costs[data.tapLvl]) uRef.update({ coins: data.coins - costs[data.tapLvl], tapLvl: data.tapLvl + 1 });
        }

        function buyTurbo() {
            if(data.coins >= 10000) { uRef.update({ coins: data.coins - 10000, turboEnd: Date.now() + 3600000 }); closeAll(); }
        }

        function renderSkins() {
            let h = ""; skins.forEach(s => {
                const isO = data.ownedSkins.includes(s.id);
                h += `<div class="skin-box"><div style="font-size:30px">${s.id}</div><button class="btn-gold" style="padding:5px;font-size:10px" onclick="${isO ? `setS('${s.id}')` : `buyS('${s.id}',${s.p})`}">${isO ? (data.activeSkin==s.id?'ACTIVE':'USE') : s.p}</button></div>`;
            });
            document.getElementById('skinGrid').innerHTML = h;
        }

        function buyS(i, p) { if(data.coins >= p) { let o = [...data.ownedSkins, i]; uRef.update({coins: data.coins - p, ownedSkins: o}); } }
        function setS(i) { uRef.update({activeSkin: i}); }

        // ADMIN FUNCTIONS
        function sendAd() { 
            const msg = document.getElementById('adMsg').value;
            if(msg) globalRef.update({ ad_text: msg }); 
        }
        function clearAd() { globalRef.update({ ad_text: "" }); }
        function add100k() { uRef.update({ coins: data.coins + 100000 }); }

        function showLeaderboard() {
            showM('leaderboardModal');
            firebase.database().ref('users').orderByChild('coins').limitToLast(10).once('value', s => {
                let l = ""; let i = 1;
                s.forEach(c => { l = `<div>${i++}. ${c.val().name || 'User'}: ${Math.floor(c.val().coins).toLocaleString()}</div>` + l; });
                document.getElementById('leaderList').innerHTML = l;
            });
        }

        function toggleS() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { closeAll(); document.getElementById('overlay').style.display='block'; document.getElementById(id).style.display='block'; if(document.getElementById('sidebar').classList.contains('active')) toggleS(); }
        function closeAll() { document.getElementById('overlay').style.display='none'; const m = document.getElementsByClassName('modal'); for(let x of m) x.style.display='none'; }
        function saveWallet() { uRef.update({ wallet: document.getElementById('walletInput').value }); }
        function invite() { tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/Dilik_gold_bot?start=${uId}&text=Join!`); }
        tg.expand();
    </script>
</body>
</html>
