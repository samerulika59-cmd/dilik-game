<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: block; border-bottom: 1px solid #003366; text-align: left; }

        .league-container { margin-top: 80px; font-size: 24px; font-weight: bold; text-transform: uppercase; color: #ffd700; }
        #coinCount { font-size: 65px; color: #ffd700; margin-top: 10px; font-weight: bold; }
        
        .coin-wrapper { margin-top: 70px; position: relative; display: inline-block; } 
        #clicker { width: 230px; height: 230px; background: radial-gradient(circle, #ffcc33, #cc9900); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 105px; color: #663300; font-weight: bold; border: 10px solid #e6b800; cursor: pointer; transition: 0.2s; position: relative; z-index: 5; }
        
        /* Эффекти маҳкамшавӣ */
        #clicker.locked { filter: grayscale(0.8) opacity(0.6); }
        #lockOverlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 0, 0, 0.9); color: white; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 18px; z-index: 10; display: none; width: 200px; pointer-events: none; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .modal { display: none; position: fixed; top: 35%; left: 50%; transform: translate(-50%, -35%); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 1001; border: 2px solid #ffd700; }
        .btn-gold { background: #ffd700; color: black; padding: 14px; width: 100%; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        
        .plus-one { position: absolute; color: #ffd700; font-size: 28px; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div class="menu-icon" onclick="toggleSidebar()">☰</div>

    <div class="sidebar" id="sidebar">
        <a href="#" onclick="showModal('shopModal')">🛒 Shop</a>
        <a href="#" onclick="showModal('walletModal')">👛 Wallet</a>
        <a href="#" onclick="toggleSidebar()" style="color: #ff8888; margin-top: 20px;">❌ Close</a>
    </div>

    <div class="league-container">LEAGUE: <span id="leagueName">BRONZE</span></div>
    <div id="coinCount">0</div>

    <div class="coin-wrapper" onclick="handleCoinClick(event)">
        <div id="lockOverlay">UPGRADE REQUIRED! <br> <span style="font-size: 12px;">Click to buy</span></div>
        <div id="clicker">D</div>
    </div>
    
    <div style="margin-top:35px; color:#ffd700; font-weight: 500;">Tap to Earn!</div>

    <div id="shopModal" class="modal">
        <h2 style="color:#ffd700;">🛒 SHOP</h2>
        <p id="shopMessage">You reached the limit! Upgrade to continue earning.</p>
        <button class="btn-gold" id="upgradeBtn" onclick="processUpgrade()">BUY ACCESS (20 🪙)</button>
        <p onclick="closeModal('shopModal')" style="color:#ff4444; margin-top:20px; cursor:pointer;">Close</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBM9eh6zH_u0mk4G8YdZdyu0QFnw5bkbCI",
            authDomain: "dilik-game.firebaseapp.com",
            databaseURL: "https://dilik-game-default-rtdb.firebaseio.com",
            projectId: "dilik-game",
            storageBucket: "dilik-game.firebasestorage.app",
            messagingSenderId: "354871648694",
            appId: "1:354871648694:web:37372e8ef8dc33eaff2117"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const userRef = database.ref('users/' + userId);

        let coins = 0;
        let isUpgraded = false;
        let isLocked = false;

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                coins = data.coins || 0;
                isUpgraded = data.isUpgraded || false;
                document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
                checkStatus();
            }
        });

        function checkStatus() {
            const clicker = document.getElementById('clicker');
            const overlay = document.getElementById('lockOverlay');

            // Лимити санҷишӣ: 100 танга
            if (coins >= 100 && !isUpgraded) {
                isLocked = true;
                clicker.classList.add('locked');
                overlay.style.display = 'block';
            } else {
                isLocked = false;
                clicker.classList.remove('locked');
                overlay.style.display = 'none';
            }
        }

        function handleCoinClick(e) {
            if (isLocked) {
                tg.HapticFeedback.notificationOccurred('warning');
                showModal('shopModal'); // Автоматӣ тирезаи харидро мебарорад
                return;
            }

            coins++;
            userRef.update({ coins: coins });
            tg.HapticFeedback.impactOccurred('light');

            // Animation +1
            const plus = document.createElement('div');
            plus.innerText = '+1';
            plus.className = 'plus-one';
            plus.style.left = (e.clientX - 10) + 'px';
            plus.style.top = (e.clientY - 20) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 800);
        }

        function processUpgrade() {
            if (coins >= 20) {
                coins -= 20;
                isUpgraded = true;
                userRef.update({ coins: coins, isUpgraded: true });
                alert("Upgrade Successful! You can now continue.");
                closeModal('shopModal');
            } else {
                alert("Not enough coins!");
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
