<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilik Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #coinCount { font-size: 45px; color: #ffd700; margin-top: 20px; font-weight: bold; }
        #clicker { width: 200px; height: 200px; border-radius: 50%; cursor: pointer; transition: transform 0.1s; margin: 30px 0; -webkit-tap-highlight-color: transparent; }
        #clicker:active { transform: scale(0.95); }
        .btn { background: #333; color: white; border: 1px solid #ffd700; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-size: 16px; margin: 10px; width: 85%; }
        .wallet-section { display: none; background: #252525; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #444; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 14px; }
        #withdrawBtn { display: none; background: #ffd700; color: black; font-weight: bold; }
        .status { font-size: 12px; color: #777; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="coinCount">0</div>
    <img id="clicker" src="https://cdn-icons-png.flaticon.com/512/5968/5968310.png" alt="Coin">
    
    <button class="btn" onclick="toggleWallet()">👛 Wallet (Ҳамён)</button>

    <div id="walletSection" class="wallet-section">
        <h3>Танзимоти ҳамён</h3>
        <input type="text" id="walletAddr" placeholder="Суроғаи TON-ро ворид кунед">
        <button class="btn" onclick="saveWallet()">Захираи ҳамён</button>
        <p id="limitMsg" style="color: #ff4444; font-size: 14px;">Бояд 200,000 танга ҷамъ кунед.</p>
        <button id="withdrawBtn" class="btn" onclick="requestWithdraw()">💸 Вывод</button>
    </div>
    <div class="status" id="status">Сервер: Пайваст...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBM9eh6zH_u0mk4G8YdZdyu0QFnw5bkbCI",
            authDomain: "dilik-game.firebaseapp.com",
            databaseURL: "https://dilik-game-default-rtdb.firebaseio.com",
            projectId: "dilik-game",
            storageBucket: "dilik-game.firebasestorage.app",
            messagingSenderId: "354871648694",
            appId: "1:354871648694:web:37372e8ef8dc33eaff2117"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_" + Math.floor(Math.random() * 1000);
        const userName = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Меҳмон";
        const userRef = database.ref('users/' + userId);
        let coins = 0;

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                coins = data.coins || 0;
                document.getElementById('coinCount').innerText = coins.toLocaleString();
                if (data.wallet) document.getElementById('walletAddr').value = data.wallet;
                
                if (coins >= 200000) {
                    document.getElementById('withdrawBtn').style.display = 'block';
                    document.getElementById('limitMsg').innerText = "Шумо метавонед пулро гиред!";
                    document.getElementById('limitMsg').style.color = "#44ff44";
                }
            } else {
                userRef.set({ name: userName, coins: 0 });
            }
        });

        document.getElementById('clicker').onclick = () => {
            coins++;
            document.getElementById('coinCount').innerText = coins.toLocaleString();
            userRef.update({ coins: coins });
        };

        function toggleWallet() {
            const s = document.getElementById('walletSection');
            s.style.display = s.style.display === 'block' ? 'none' : 'block';
        }

        function saveWallet() {
            const addr = document.getElementById('walletAddr').value;
            if (addr.length > 10) {
                userRef.update({ wallet: addr });
                alert("Ҳамён захира шуд!");
            } else {
                alert("Суроғаро дуруст нависед!");
            }
        }

        function requestWithdraw() {
            database.ref('withdraw_requests/' + userId).set({
                userId: userId,
                name: userName,
                coins: coins,
                wallet: document.getElementById('walletAddr').value,
                date: new Date().toLocaleString(),
                status: "pending"
            });
            alert("Дархости шумо барои 200,000+ танга фиристода шуд!");
        }
    </script>
</body>
</html>
