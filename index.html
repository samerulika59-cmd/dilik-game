<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: flex; align-items: center; border-bottom: 1px solid #003366; margin: 5px 10px; border-radius: 12px; }

        .league-container { margin-top: 60px; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; }
        #coinCount { font-size: 60px; color: #ffd700; margin-top: 5px; font-weight: bold; }
        
        #clicker { width: 220px; height: 220px; background: radial-gradient(circle, #ffcc33, #cc9900); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 100px; color: #663300; font-weight: bold; border: 10px solid #e6b800; cursor: pointer; margin-top: 20px; -webkit-tap-highlight-color: transparent; box-shadow: 0 0 30px rgba(255,204,51,0.3); }
        #clicker:active { transform: scale(0.95); }

        /* Ислоҳи қуттии Ҳамён */
        .modal { display: none; position: fixed; top: 35%; left: 50%; transform: translate(-50%, -35%); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 1001; border: 2px solid #ffd700; }
        input { width: 90%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 2px solid #ffd700; background: white !important; color: black !important; font-size: 16px; -webkit-user-select: text; user-select: text; }
        .btn-gold { background: #ffd700; color: black; padding: 12px; width: 100%; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="menu-icon" onclick="toggleSidebar()">☰</div>

    <div class="sidebar" id="sidebar">
        <a href="#" onclick="showModal('walletModal')">👛 Ҳамён</a>
        <a href="#" onclick="showModal('botModal')">🤖 Автобот (Сатҳ: <span id="botLvlMenu">0</span>)</a>
        <a href="#" onclick="inviteFriend()">👥 Даъвати дӯст</a>
        <a href="#" onclick="toggleSidebar()" style="margin-top: 30px; color: #ff8888;">❌ Пӯшидан</a>
    </div>

    <div class="league-container" id="leagueBox"><span id="leagueName">Bronze</span></div>
    <div id="coinCount">0</div>
    <div id="clicker">D</div>
    <div style="margin-top:15px; color:#ffd700;">Зер кун ва пул ба даст ор!</div>

    <div id="walletModal" class="modal">
        <h3 style="color:#ffd700;">Ҳамёни TON</h3>
        <input type="text" id="walletAddr" placeholder="Суроғаро ин ҷо гузоред (Paste)">
        <button class="btn-gold" onclick="saveWallet()">ЗАХИРА КАРДАН</button>
        <p onclick="closeModal('walletModal')" style="color:#ff4444; margin-top:15px;">Бақия</p>
    </div>

    <div id="botModal" class="modal">
        <h3 style="color:#ffd700;">🤖 Боти Худкор</h3>
        <p id="botDesc">Бот дар вақти хомӯш будани экран танга ҷамъ мекунад.</p>
        <p>Сатҳи ҳозира: <span id="currentLvl">0</span></p>
        <button id="upgradeBotBtn" class="btn-gold" onclick="upgradeBot()">Навсозӣ (500 🪙)</button>
        <p onclick="closeModal('botModal')" style="color:#ff4444; margin-top:15px;">Бақия</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBM9eh6zH_u0mk4G8YdZdyu0QFnw5bkbCI",
            authDomain: "dilik-game.firebaseapp.com",
            databaseURL: "https://dilik-game-default-rtdb.firebaseio.com",
            projectId: "dilik-game",
            storageBucket: "dilik-game.firebasestorage.app",
            messagingSenderId: "354871648694",
            appId: "1:354871648694:web:37372e8ef8dc33eaff2117"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const userRef = database.ref('users/' + userId);
        
        let coins = 0;
        let botLevel = 0;
        const botPrices = [0, 500, 2000, 5000, 10000, 20000, 40000, 70000, 100000, 150000, "ПУЛ"];

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                coins = data.coins || 0;
                botLevel = data.botLevel || 0;
                document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
                document.getElementById('botLvlMenu').innerText = botLevel;
                document.getElementById('currentLvl').innerText = botLevel;
                
                let nextPrice = botPrices[botLevel + 1];
                document.getElementById('upgradeBotBtn').innerText = (botLevel >= 9) ? "Сатҳи 10 (Бо Пул)" : "Навсозӣ (" + nextPrice + " 🪙)";

                // Ҳисоби офлайн
                if (botLevel > 0 && data.lastLogin) {
                    let seconds = Math.floor((Date.now() - data.lastLogin) / 1000);
                    if (seconds > 10) {
                        let earned = seconds * (botLevel * 0.5); // Ҳар сатҳ суръатро зиёд мекунад
                        coins += earned;
                        userRef.update({ coins: coins, lastLogin: Date.now() });
                        alert("Боти сатҳи " + botLevel + " ба шумо " + Math.floor(earned) + " танга овард! 🤖");
                    }
                }
            } else {
                userRef.set({ coins: 0, botLevel: 0, lastLogin: Date.now() });
            }
        });

        document.getElementById('clicker').onclick = () => {
            coins++;
            document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
            userRef.update({ coins: coins, lastLogin: Date.now() });
            tg.HapticFeedback.impactOccurred('medium');
        };

        function upgradeBot() {
            if (botLevel >= 9) {
                alert("Барои сатҳи 10 ба админ нависед: @Dilik_admin");
                return;
            }
            let price = botPrices[botLevel + 1];
            if (coins >= price) {
                coins -= price;
                botLevel++;
                userRef.update({ coins: coins, botLevel: botLevel });
                alert("Бот ба сатҳи " + botLevel + " бардошта шуд!");
            } else {
                alert("Тангаи кофӣ надоред!");
            }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showModal(id) { document.getElementById(id).style.display = 'block'; toggleSidebar(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function saveWallet() {
            const addr = document.getElementById('walletAddr').value.trim();
            if (addr.length > 8) {
                userRef.update({ wallet: addr });
                alert("Ҳамён захира шуд!");
                closeModal('walletModal');
            }
        }

        function inviteFriend() {
            const link = "https://t.me/Dilik_gold_bot?start=" + userId;
            tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(link));
        }
        
        setInterval(() => { if(userId) userRef.update({ lastLogin: Date.now() }); }, 10000);
    </script>
</body>
</html>
