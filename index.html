<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
#turboTimerDisplay {
    color: #ff4444;
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
    display: none; /* Танҳо вақте турбо фаъол аст, намоён мешавад */
    text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
}

</head>
<body>

    <div id="sidebar" class="sidebar">
        <a onclick="showLeaderboard()">🏆 Top 10 Players (8k)</a>
        <a onclick="joinChannel()" style="color:#00e5ff">📢 Join Channel (+5k)</a>
        <a onclick="showM('turboModal')" id="turboBtnMenu" style="color:#ff4444">🔥 Turbo Mode (10k)</a>
        <a onclick="showM('skinModal')" style="color:#00ff00">🎨 Skin Shop</a>
        <a onclick="showM('upgradeModal')">🚀 Upgrade Tap</a>
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Wallet (TON)</a>
        <a id="adminLink" onclick="showM('adminModal')" style="display:none; color:#00ff00; font-weight:bold;">🛠 Admin Panel</a>
        <a onclick="toggleS()" style="color:#ff4444; margin-top: 20px;">❌ Close</a>
    </div>

    <div style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 35px;" onclick="toggleS()">☰</span>
            <span style="background: #ffd700; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold;">PLATINUM LEAGUE</span>
            <span></span>
        </div>
        <div id="ad-banner"></div>
        <div id="balance" style="font-size: 45px; color: #ffd700; font-weight: bold; margin-top: 10px;">WAIT...</div>
        <div id="turboTimerDisplay">TURBO: 59:59</div>
    </div>

    <div class="click-area">
        <div id="loadingContainer">
            <div id="loader"></div>
        </div>
        <div id="clicker" onclick="handleTap(event)">D</div>
    </div>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="turboModal" class="modal">
        <h2>🔥 TURBO MODE</h2>
        <p>Cost: 10,000 | Effect: +5 per tap | Duration: 1 hour</p>
        <button id="buyTurboBtn" class="btn-gold" onclick="buyTurbo()">ACTIVATE</button>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">CLOSE</button>
    </div>

    <div id="skinModal" class="modal"><h2>🎨 SKIN SHOP</h2><div id="skinGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div><button class="btn-gold" style="background:#444; color:#fff; margin-top: 15px;" onclick="closeAll()">CLOSE</button></div>
    <div id="upgradeModal" class="modal"><h2>🚀 UPGRADE</h2><p>Level: <b id="lvlNow">1</b> / 5</p><button id="upBtn" class="btn-gold" onclick="doUpgrade()">UPGRADE</button><button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">BACK</button></div>
    <div id="adminModal" class="modal"><h2>🛠 ADMIN</h2><textarea id="adMsg" style="width:100%; height:60px; margin-bottom:10px;"></textarea><button class="btn-gold" onclick="sendAd()">📢 SEND</button><button class="btn-gold" onclick="add100k()" style="background:#222; color:#0ff;">+100K</button><button class="btn-gold" style="background:#444;" onclick="closeAll()">BACK</button></div>
    <div id="walletModal" class="modal"><h2>👛 WALLET</h2><input type="text" id="walletInput" placeholder="UQ..." style="width:100%; padding:10px;"><button class="btn-gold" onclick="saveWallet()">SAVE</button><button class="btn-gold" style="background:#444;" onclick="closeAll()">BACK</button></div>
    <div id="leaderboardModal" class="modal"><h2>🏆 TOP 10</h2><div id="leaderList"></div><button class="btn-gold" style="background:#444;" onclick="closeAll()">CLOSE</button></div>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 5863448768;
        firebase.initializeApp({ databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" });
        const uId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "local_user";
        const uRef = firebase.database().ref('users/' + uId);
        const globalRef = firebase.database().ref('global_config');

        let data = { coins: 0, tapLvl: 0, turboEnd: 0, activeSkin: "D", ownedSkins: ["D"], wallet: "", lastLeaderboardPayDate: "", joinedChannel: false };
        let isReady = false;

        const costs = [3000, 8000, 15000, 25000, 45000];
        const skins = [{id: "D", p: 0}, {id: "₿", p: 50000}, {id: "💎", p: 100000}, {id: "🥇", p: 25000}, {id: "🥈", p: 10000}, {id: "🚀", p: 75000}, {id: "🔥", p: 40000}, {id: "🌟", p: 20000}, {id: "💰", p: 15000}, {id: "👑", p: 90000}, {id: "🍎", p: 30000}, {id: "⚡", p: 55000}];

        uRef.on('value', s => {
            if(s.val()) data = {...data, ...s.val()}; else uRef.set(data);
            isReady = true;
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('clicker').style.display = 'flex';
            updateUI();
        });

        function updateUI() {
            if(!isReady) return;
            document.getElementById('balance').innerText = Math.floor(data.coins).toLocaleString();
            document.getElementById('clicker').innerText = data.activeSkin;
            document.getElementById('lvlNow').innerText = data.tapLvl + 1;
            if(data.tapLvl < 5) document.getElementById('upBtn').innerText = `UPGRADE (${costs[data.tapLvl].toLocaleString()})`;
            else document.getElementById('upBtn').innerText = "MAX";
            if(uId == ADMIN_ID) document.getElementById('adminLink').style.display = 'block';
            renderSkins();
            checkTurboStatus();
        }

        function checkTurboStatus() {
            const now = Date.now();
            const timerDisplay = document.getElementById('turboTimerDisplay');
            const menuBtn = document.getElementById('turboBtnMenu');
            const modalBtn = document.getElementById('buyTurboBtn');

            if (now < data.turboEnd) {
                let diff = data.turboEnd - now;
                let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                // Намоиш дар зери тангаҳо
                timerDisplay.innerText = `TURBO ACTIVE: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timerDisplay.style.display = 'block';
                
                menuBtn.innerText = `🔥 Turbo Active (${minutes}m)`;
                modalBtn.innerText = "ALREADY ACTIVE";
                modalBtn.disabled = true;
            } else {
                timerDisplay.style.display = 'none';
                menuBtn.innerText = "🔥 Turbo Mode (10k)";
                modalBtn.innerText = "ACTIVATE";
                modalBtn.disabled = false;
            }
        }

        function buyTurbo() {
            if(!isReady || Date.now() < data.turboEnd) return;
            if(data.coins >= 10000) {
                data.coins -= 10000;
                data.turboEnd = Date.now() + 3600000;
                uRef.update({ coins: data.coins, turboEnd: data.turboEnd });
                alert("Turbo Activated!");
                closeAll();
            } else alert("Not enough coins!");
        }

        function handleTap(e) {
            if(!isReady) return;
            const gain = (1 + data.tapLvl) + (Date.now() < data.turboEnd ? 5 : 0);
            data.coins += gain;
            uRef.update({ coins: data.coins, name: tg.initDataUnsafe.user?.first_name || "User" });
            const n = document.createElement('div'); n.className = 'tap-number'; n.innerText = `+${gain}`;
            n.style.left = `${e.clientX - 20}px`; n.style.top = `${e.clientY - 40}px`;
            document.body.appendChild(n); setTimeout(() => n.remove(), 800);
            tg.HapticFeedback.impactOccurred('light');
        }

        // Функсияҳои дигар (Топ 10, Скин ва ғ.) бетағйир монданд
        function showLeaderboard() {
            const now = new Date(); const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
            if (data.lastLeaderboardPayDate === todayStr) loadAndShowLeaderboard();
            else if (confirm("View Top 10 costs 8,000 coins. Proceed?")) {
                if (data.coins >= 8000) { data.coins -= 8000; data.lastLeaderboardPayDate = todayStr; uRef.update({ coins: data.coins, lastLeaderboardPayDate: todayStr }); loadAndShowLeaderboard(); }
            }
        }
        function loadAndShowLeaderboard() { showM('leaderboardModal'); firebase.database().ref('users').orderByChild('coins').limitToLast(10).once('value', s => { let l = ""; let players = []; s.forEach(c => { players.push(c.val()); }); players.reverse().forEach((p, i) => { let r = i===0?"🥇":i===1?"🥈":i===2?"🥉":""; l += `<div style="padding:8px; border-bottom:1px solid #333">${i+1}. ${p.name || 'User'}: ${Math.floor(p.coins).toLocaleString()} ${r}</div>`; }); document.getElementById('leaderList').innerHTML = l; }); }
        function joinChannel() { tg.openTelegramLink("https://t.me/DILIK_officia"); if(!data.joinedChannel) { data.coins += 5000; data.joinedChannel = true; uRef.update({ coins: data.coins, joinedChannel: true }); } }
        function renderSkins() { let h = ""; skins.forEach(s => { const isO = data.ownedSkins.includes(s.id); h += `<div class="skin-box"><div style="font-size:30px">${s.id}</div><button class="btn-gold" style="padding:5px;font-size:10px" onclick="${isO ? `setS('${s.id}')` : `buyS('${s.id}',${s.p})`}">${isO ? (data.activeSkin==s.id?'ACTIVE':'USE') : s.p}</button></div>`; }); document.getElementById('skinGrid').innerHTML = h; }
        function buyS(i, p) { if(data.coins >= p) { let o = [...data.ownedSkins, i]; uRef.update({coins: data.coins - p, ownedSkins: o}); } }
        function setS(i) { uRef.update({activeSkin: i}); }
        function sendAd() { globalRef.update({ ad_text: document.getElementById('adMsg').value }); }
        function add100k() { uRef.update({ coins: data.coins + 100000 }); }
        function toggleS() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { closeAll(); document.getElementById('overlay').style.display='block'; document.getElementById(id).style.display='block'; if(document.getElementById('sidebar').classList.contains('active')) toggleS(); }
        function closeAll() { document.getElementById('overlay').style.display='none'; const m = document.getElementsByClassName('modal'); for(let x of m) x.style.display='none'; }
        function saveWallet() { uRef.update({ wallet: document.getElementById('walletInput').value }); alert("Saved!"); }
        function invite() { tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/Dilik_gold_bot?start=${uId}&text=Join and Earn!`); }
        tg.expand();
        
        // Таймерро ҳар сония нав мекунем
        setInterval(checkTurboStatus, 1000); 
    </script>
</body>
</html>
