<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; text-align: left; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: block; border-bottom: 1px solid #003366; cursor: pointer; }
        
        .league-header { margin-top: 60px; font-size: 24px; font-weight: 900; color: #ffffff; text-transform: uppercase; }
        #coinCount { font-size: 60px; color: #ffd700; margin-top: 5px; font-weight: bold; }
        
        .coin-wrapper { margin-top: 30px; position: relative; display: inline-block; -webkit-tap-highlight-color: transparent; } 
        #clicker { width: 210px; height: 210px; background: radial-gradient(circle, #ffcc33, #cc9900); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 90px; color: #663300; font-weight: bold; border: 8px solid #e6b800; cursor: pointer; box-shadow: 0 0 30px rgba(255,215,0,0.3); transition: transform 0.05s; user-select: none; }
        #clicker:active { transform: scale(0.96); }
        
        /* Smaller & Lower Auto-Bot UI */
        .bot-container { margin-top: 60px; margin-left: auto; margin-right: auto; width: 75%; background: rgba(255, 215, 0, 0.08); padding: 10px; border-radius: 15px; border: 1px solid rgba(255, 215, 0, 0.4); }
        .bot-info { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #ffd700; }
        .bot-btn { background: #ffd700; color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }
        
        .modal { display: none; position: fixed; top: 15%; left: 50%; transform: translate(-50%, 0); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 1001; border: 2px solid #ffd700; box-sizing: border-box; }
        .btn-action { background: #ffd700; color: black; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; background: #eee; color: #000; }
        
        .plus-one { position: absolute; color: #ffd700; font-size: 32px; font-weight: bold; pointer-events: none; animation: floatUp 0.7s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>
    <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    <div class="sidebar" id="sidebar">
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Wallet & Transfer</a>
        <a href="https://t.me/DILIK_officia" target="_blank" onclick="claimBonus()">📢 Join Channel (+5k)</a>
        <a onclick="showM('tariffModal')">📊 Tariffs</a>
        <a id="adminBtn" onclick="showM('adminModal')" style="display:none; color:#00ff00;">🛠 Admin Panel</a>
        <a onclick="toggleSidebar()" style="color:#ff4444">❌ Close</a>
    </div>

    <div class="league-header" id="leagueName">BRONZE</div>
    <div id="coinCount">0</div>
    <div class="coin-wrapper" onclick="handleTap(event)"><div id="clicker">D</div></div>
    
    <div class="bot-container">
        <div class="bot-info">
            <span>🤖 AUTO-BOT</span>
            <span id="botLevelDisplay">LVL: 0</span>
        </div>
        <button id="upgradeBotBtn" class="bot-btn" onclick="upgradeBot()">UPGRADE (500)</button>
    </div>

    <div id="adminModal" class="modal">
        <h2 style="color:#00ff00">ADMIN PANEL</h2>
        <p>Welcome, Owner!</p>
        <button class="btn-action" onclick="addAdminCoins()">+100,000 Coins</button>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('adminModal')">CLOSE</button>
    </div>

    <div id="walletModal" class="modal">
        <h2 style="color:#ffd700">TRANSFER</h2>
        <input type="text" id="targetId" placeholder="Receiver ID">
        <input type="number" id="amount" placeholder="Amount">
        <button class="btn-action" onclick="transferCoins()">SEND GOLD (5% FEE)</button>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('walletModal')">BACK</button>
    </div>

    <div id="tariffModal" class="modal">
        <h2 style="color:#ffd700">TARIFFS</h2>
        <p>BRONZE: 10k | SILVER: 50k | GOLD: 100k | PLATINUM: 200k</p>
        <button class="btn-action" onclick="closeM('tariffModal')">OK</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const ADMIN_ID = 5863448768;
        const config = { databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const userRef = firebase.database().ref('users/' + userId);
        
        let coins = 0;
        let botLvl = 0;
        let bonusClaimed = false;
        // Updated prices: 1-500, 2-1500, 3-5000, 4-8000, 5-16000, 6-25000, 7-30000, 8-50000, 9-70000
        const botCosts = [500, 1500, 5000, 8000, 16000, 25000, 30000, 50000, 70000];

        userRef.on('value', (s) => {
            const data = s.val();
            coins = data?.coins || 0;
            botLvl = data?.botLvl || 0;
            bonusClaimed = data?.bonusClaimed || false;

            document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
            document.getElementById('botLevelDisplay').innerText = `LVL: ${botLvl}`;
            
            let btn = document.getElementById('upgradeBotBtn');
            if (botLvl >= 10) {
                btn.innerText = "MAX LEVEL (PAID)";
                btn.disabled = true;
            } else if (botLvl === 9) {
                btn.innerText = "BUY LVL 10 ($0.5)";
            } else {
                btn.innerText = `UPGRADE (${botCosts[botLvl].toLocaleString()})`;
            }

            if (userId == ADMIN_ID) document.getElementById('adminBtn').style.display = 'block';
        });

        setInterval(() => {
            if (botLvl > 0) {
                let gain = botLvl * 0.4; 
                coins += gain;
                userRef.update({coins: coins});
            }
        }, 1000);

        function handleTap(e) {
            coins++;
            userRef.update({coins: coins});
            tg.HapticFeedback.impactOccurred('medium');
            const plus = document.createElement('div');
            plus.innerText = '+1';
            plus.className = 'plus-one';
            plus.style.left = (e.clientX - 10) + 'px';
            plus.style.top = (e.clientY - 40) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 700);
        }

        function upgradeBot() {
            if (botLvl === 9) {
                tg.showAlert("Redirecting to Telegram Payment for LVL 10...");
                return;
            }
            if (botLvl >= 10) return;

            let cost = botCosts[botLvl];
            if (coins >= cost) {
                coins -= cost;
                botLvl++;
                userRef.update({coins: coins, botLvl: botLvl});
                tg.showAlert(`Level ${botLvl} activated!`);
            } else {
                tg.showAlert("Not enough coins!");
            }
        }

        function transferCoins() {
            const tid = document.getElementById('targetId').value;
            const amt = parseInt(document.getElementById('amount').value);
            if (coins >= amt && tid) {
                const fee = Math.floor(amt * 0.05);
                userRef.update({coins: coins - amt});
                firebase.database().ref('users/'+tid).once('value', s => {
                    let c = s.val()?.coins || 0;
                    firebase.database().ref('users/'+tid).update({coins: c + (amt-fee)});
                });
                tg.showAlert("Gold sent successfully!");
                closeM('walletModal');
            }
        }

        function claimBonus() {
            if (!bonusClaimed) {
                coins += 5000;
                userRef.update({coins: coins, bonusClaimed: true});
                tg.showAlert("5,000 coins bonus added!");
            }
        }

        function addAdminCoins() {
            coins += 100000;
            userRef.update({coins: coins});
            tg.showAlert("Admin: 100k added!");
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { document.getElementById(id).style.display='block'; toggleSidebar(); }
        function closeM(id) { document.getElementById(id).style.display='none'; }
        function invite() {
            const botLink = `https://t.me/Dilik_gold_bot?start=${userId}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=Join%20Dilik%20Gold!`);
        }
    </script>
</body>
</html>
