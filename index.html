<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; display: flex; flex-direction: column; height: 100vh; }
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; text-align: left; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: block; border-bottom: 1px solid #003366; cursor: pointer; }
        
        /* Layout Adjustments - Moving elements down */
        .content-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 50px; }
        
        .league-header { font-size: 22px; font-weight: 900; color: #ffffff; text-transform: uppercase; margin-bottom: 5px; }
        #coinCount { font-size: 55px; color: #ffd700; margin-bottom: 20px; font-weight: bold; }
        
        .coin-wrapper { position: relative; display: inline-block; margin-bottom: 40px; -webkit-tap-highlight-color: transparent; } 
        #clicker { width: 200px; height: 200px; background: radial-gradient(circle, #ffcc33, #cc9900); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 85px; color: #663300; font-weight: bold; border: 8px solid #e6b800; cursor: pointer; box-shadow: 0 0 25px rgba(255,215,0,0.3); transition: transform 0.05s; user-select: none; margin: 0 auto; }
        #clicker:active { transform: scale(0.95); }
        
        .bot-container { margin: 0 auto 20px auto; width: 80%; background: rgba(255, 215, 0, 0.08); padding: 12px; border-radius: 15px; border: 1px solid rgba(255, 215, 0, 0.3); }
        .bot-info { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #ffd700; }
        .bot-btn { background: #ffd700; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 13px; }
        
        .modal { display: none; position: fixed; top: 10%; left: 50%; transform: translate(-50%, 0); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 1001; border: 2px solid #ffd700; box-sizing: border-box; max-height: 80vh; overflow-y: auto; }
        .btn-action { background: #ffd700; color: black; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        textarea { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; background: #eee; color: #000; min-height: 80px; }
        
        .plus-one { position: absolute; color: #ffd700; font-size: 32px; font-weight: bold; pointer-events: none; animation: floatUp 0.7s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>
    <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    <div class="sidebar" id="sidebar">
        <a onclick="showLeaderboard()">🏆 Top 10 Players</a>
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Telegram Wallet</a>
        <a href="https://t.me/DILIK_officia" target="_blank" onclick="claimBonus()">📢 Join Channel (+5k)</a>
        <a id="adminBtn" onclick="showAdminPanel()" style="display:none; color:#00ff00;">🛠 Admin Panel</a>
        <a onclick="toggleSidebar()" style="color:#ff4444">❌ Close</a>
    </div>

    <div class="content-area">
        <div class="league-header" id="leagueName">BRONZE</div>
        <div id="coinCount">0</div>
        
        <div class="coin-wrapper" onclick="handleTap(event)">
            <div id="clicker">D</div>
        </div>
        
        <div class="bot-container">
            <div class="bot-info"><span>🤖 AUTO-BOT</span><span id="botLevelDisplay">LVL: 0</span></div>
            <button id="upgradeBotBtn" class="bot-btn" onclick="upgradeBot()">UPGRADE (500)</button>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <h2 style="color:#00ff00">ADMIN PANEL</h2>
        <p id="totalUsersStat">Total Players: ...</p>
        <textarea id="broadcastMsg" placeholder="Write message to all..."></textarea>
        <button class="btn-action" style="background:#0088cc; color:white;" onclick="sendBroadcast()">📢 SEND BROADCAST</button>
        <button class="btn-action" style="background:#ff4444; color:white;" onclick="clearBroadcast()">🗑 DELETE BROADCAST</button>
        <button class="btn-action" onclick="addAdminCoins()">💰 +100,000 COINS</button>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('adminModal')">CLOSE</button>
    </div>

    <div id="walletModal" class="modal">
        <h2 style="color:#ffd700">TELEGRAM WALLET</h2>
        <p>Connect your official Telegram Wallet to withdraw or deposit funds.</p>
        <button class="btn-action" onclick="connectWallet()">👛 CONNECT WALLET</button>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('walletModal')">BACK</button>
    </div>

    <div id="leaderModal" class="modal">
        <h2 style="color:#ffd700">🏆 TOP 10 PLAYERS</h2>
        <div id="leaderList">Loading...</div>
        <button class="btn-action" style="background:#444; color:white;" onclick="closeM('leaderModal')">CLOSE</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const ADMIN_ID = 5863448768;
        const config = { databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const userName = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "User";
        const userRef = firebase.database().ref('users/' + userId);
        const globalRef = firebase.database().ref('global_config');
        
        let coins = 0;
        let botLvl = 0;
        const botCosts = [500, 1500, 5000, 8000, 16000, 25000, 30000, 50000, 70000];

        // Broadcast listener
        globalRef.child('broadcast').on('value', (s) => {
            const msg = s.val();
            if (msg) tg.showPopup({ title: 'Announcement 📢', message: msg, buttons: [{type: 'ok'}] });
        });

        userRef.on('value', (s) => {
            const data = s.val() || {};
            coins = data.coins || 0;
            botLvl = data.botLvl || 0;
            userRef.update({ name: userName, coins: coins });

            document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
            document.getElementById('botLevelDisplay').innerText = `LVL: ${botLvl}`;
            
            let l = "BRONZE";
            if(coins >= 10000) l = "SILVER";
            if(coins >= 50000) l = "GOLD";
            if(coins >= 100000) l = "PLATINUM";
            document.getElementById('leagueName').innerText = l + " LEAGUE";

            let btn = document.getElementById('upgradeBotBtn');
            if (botLvl >= 10) { btn.innerText = "MAX LEVEL"; btn.disabled = true; }
            else { btn.innerText = `UPGRADE (${botCosts[botLvl]?.toLocaleString() || '70,000'})`; }

            if (userId == ADMIN_ID) document.getElementById('adminBtn').style.display = 'block';
        });

        setInterval(() => { if (botLvl > 0) { coins += botLvl * 0.4; userRef.update({coins: coins}); } }, 1000);

        function handleTap(e) {
            coins++;
            userRef.update({coins: coins});
            tg.HapticFeedback.impactOccurred('medium');
            const plus = document.createElement('div');
            plus.innerText = '+1'; plus.className = 'plus-one';
            plus.style.left = (e.clientX - 10) + 'px'; plus.style.top = (e.clientY - 40) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 700);
        }

        function connectWallet() {
            tg.showAlert("Connecting to Telegram Wallet... (Feature coming soon)");
            // In real app: tg.openTelegramLink("https://t.me/wallet");
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg) return;
            globalRef.update({ broadcast: msg }).then(() => {
                tg.showAlert("Sent to all players!");
            });
        }

        function clearBroadcast() {
            globalRef.update({ broadcast: null }).then(() => {
                tg.showAlert("Broadcast deleted.");
                document.getElementById('broadcastMsg').value = "";
            });
        }

        function showAdminPanel() {
            firebase.database().ref('users').once('value', (s) => {
                document.getElementById('totalUsersStat').innerText = `Total Players: ${s.numChildren()}`;
            });
            showM('adminModal');
        }

        function showLeaderboard() {
            showM('leaderModal');
            firebase.database().ref('users').orderByChild('coins').limitToLast(10).once('value', (s) => {
                let html = "";
                let players = [];
                s.forEach(child => { players.push(child.val()); });
                players.reverse().forEach((p, i) => {
                    let medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + ".";
                    html += `<div class="leader-item" style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333;"><span>${medal} ${p.name || 'Player'}</span> <b>${Math.floor(p.coins).toLocaleString()}</b></div>`;
                });
                document.getElementById('leaderList').innerHTML = html;
            });
        }

        function upgradeBot() {
            if (botLvl >= 9) { tg.showAlert("Level 10 is paid!"); return; }
            let cost = botCosts[botLvl];
            if (coins >= cost) { coins -= cost; botLvl++; userRef.update({coins: coins, botLvl: botLvl}); }
            else tg.showAlert("Not enough coins!");
        }

        function addAdminCoins() { coins += 100000; userRef.update({coins: coins}); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { document.getElementById(id).style.display='block'; toggleSidebar(); }
        function closeM(id) { document.getElementById(id).style.display='none'; }
        function invite() {
            const botLink = `https://t.me/Dilik_gold_bot?start=${userId}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=Join%20Dilik%20Gold!`);
        }
    </script>
</body>
</html>
