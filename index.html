<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* Бозгашти ранги тиллоии боҳашамат */
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        
        .league-container { margin-top: 80px; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        #coinCount { font-size: 70px; color: #ffd700; margin-top: 10px; font-weight: bold; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        
        .coin-wrapper { margin-top: 70px; position: relative; display: inline-block; } 
        #clicker { 
            width: 230px; height: 230px; 
            background: radial-gradient(circle, #ffcc33, #cc9900); 
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; 
            font-size: 105px; color: #663300; font-weight: bold; 
            border: 10px solid #e6b800; cursor: pointer; 
            box-shadow: 0 0 40px rgba(255,204,51,0.4); transition: transform 0.1s; 
        }
        #clicker:active { transform: scale(0.95); }
        #clicker.locked { filter: grayscale(0.5) brightness(0.5); }

        #lockOverlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 0, 0, 0.9); color: white; padding: 15px; border-radius: 15px; font-weight: bold; z-index: 10; display: none; width: 200px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .modal { display: none; position: fixed; top: 35%; left: 50%; transform: translate(-50%, -35%); background: #001c3d; padding: 30px; border-radius: 25px; width: 85%; z-index: 1001; border: 2px solid #ffd700; box-shadow: 0 0 30px rgba(255,215,0,0.2); }
        .btn-gold { background: #ffd700; color: black; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; }
        
        .plus-one { position: absolute; color: #ffd700; font-size: 30px; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div class="league-container">BRONZE LEAGUE</div>
    <div id="coinCount">0</div>

    <div class="coin-wrapper" onclick="handleTap(event)">
        <div id="lockOverlay">UPGRADE REQUIRED!<br><span style="font-size:12px">Tap to buy 1K Skin</span></div>
        <div id="clicker">D</div>
    </div>
    
    <div style="margin-top:40px; color:#ffd700; font-weight: 500; letter-spacing: 1px;">TAP TO EARN</div>

    <div id="shopModal" class="modal">
        <h2 style="color:#ffd700; margin:0;">UPGRADE SHOP</h2>
        <p style="margin-top:15px;">Unlock the **1K** gold skin and continue your journey!</p>
        <button class="btn-gold" onclick="buyUpgrade()">BUY 1K SKIN (20 🪙)</button>
        <p onclick="closeModal()" style="color:#ff4444; margin-top:20px; cursor:pointer; font-weight:bold;">CLOSE</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBM9eh6zH_u0mk4G8YdZdyu0QFnw5bkbCI",
            authDomain: "dilik-game.firebaseapp.com",
            databaseURL: "https://dilik-game-default-rtdb.firebaseio.com",
            projectId: "dilik-game",
            storageBucket: "dilik-game.firebasestorage.app",
            messagingSenderId: "354871648694",
            appId: "1:354871648694:web:37372e8ef8dc33eaff2117"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const userRef = database.ref('users/' + userId);

        let coins = 0; let isUpgraded = false;

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                coins = data.coins || 0;
                isUpgraded = data.isUpgraded || false;
                document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
                
                const clicker = document.getElementById('clicker');
                const overlay = document.getElementById('lockOverlay');

                if (isUpgraded) {
                    clicker.innerText = "1K";
                    clicker.style.fontSize = "75px";
                } else {
                    clicker.innerText = "D";
                    clicker.style.fontSize = "105px";
                }

                if (coins >= 100 && !isUpgraded) {
                    clicker.classList.add('locked');
                    overlay.style.display = 'block';
                } else {
                    clicker.classList.remove('locked');
                    overlay.style.display = 'none';
                }
            }
        });

        function handleTap(e) {
            if (coins >= 100 && !isUpgraded) {
                tg.HapticFeedback.notificationOccurred('warning');
                document.getElementById('shopModal').style.display = 'block';
                return;
            }

            coins++;
            userRef.update({ coins: coins });
            tg.HapticFeedback.impactOccurred('medium');

            const plus = document.createElement('div');
            plus.innerText = '+1';
            plus.className = 'plus-one';
            plus.style.left = (e.clientX - 15) + 'px';
            plus.style.top = (e.clientY - 30) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 800);
        }

        function buyUpgrade() {
            if (coins >= 20) {
                userRef.update({ coins: coins - 20, isUpgraded: true });
                tg.HapticFeedback.notificationOccurred('success');
                closeModal();
            } else {
                alert("Not enough coins!");
            }
        }

        function closeModal() { document.getElementById('shopModal').style.display = 'none'; }
    </script>
</body>
</html>
