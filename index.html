<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; text-align: left; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: block; border-bottom: 1px solid #003366; cursor: pointer; }
        .league-header { margin-top: 80px; font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        #coinCount { font-size: 75px; color: #ffd700; margin-top: 10px; font-weight: bold; }
        .coin-wrapper { margin-top: 50px; position: relative; display: inline-block; } 
        #clicker { width: 240px; height: 240px; background: radial-gradient(circle, #ffcc33, #cc9900); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 100px; color: #663300; font-weight: bold; border: 8px solid #e6b800; cursor: pointer; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .modal { display: none; position: fixed; top: 30%; left: 50%; transform: translate(-50%, -30%); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 1001; border: 2px solid #ffd700; }
        .btn-action { background: #ffd700; color: black; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    <div class="sidebar" id="sidebar">
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Wallet</a>
        <a href="https://t.me/husuri_ma" target="_blank">📢 Join Channel</a>
        <a onclick="showM('tariffModal')">📊 Tariffs</a>
        <a onclick="toggleSidebar()" style="color:#ff4444">❌ Close</a>
    </div>
    <div class="league-header" id="leagueName">BRONZE LEAGUE</div>
    <div id="coinCount">0</div>
    <div class="coin-wrapper" onclick="handleTap(event)"><div id="clicker">D</div></div>
    <p style="color:#ffd700; margin-top:40px;">TAP TO EARN</p>

    <div id="tariffModal" class="modal">
        <h2 style="color:#ffd700">TARIFFS</h2>
        <p>BRONZE: 10,000 | SILVER: 50,000<br>GOLD: 100,000 | PLATINUM: 200,000</p>
        <button class="btn-action" onclick="closeM('tariffModal')">OK</button>
    </div>

    <script>
        const config = { databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database().ref('users/test_user');
        let coins = 0;
        db.on('value', (s) => {
            coins = s.val()?.coins || 0;
            document.getElementById('coinCount').innerText = coins.toLocaleString();
            let l = "BRONZE LEAGUE";
            if(coins >= 10000) l = "SILVER LEAGUE";
            if(coins >= 50000) l = "GOLD LEAGUE";
            if(coins >= 100000) l = "PLATINUM LEAGUE";
            document.getElementById('leagueName').innerText = l;
            document.getElementById('clicker').innerText = coins >= 100 ? "1K" : "D";
        });
        function handleTap(e) { coins++; db.update({coins: coins}); window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { document.getElementById(id).style.display='block'; toggleSidebar(); }
        function closeM(id) { document.getElementById(id).style.display='none'; }
    </script>
</body>
</html>
