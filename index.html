<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilik Gold Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        
        /* Менюи нав */
        .menu-icon { position: absolute; top: 25px; left: 20px; font-size: 30px; cursor: pointer; z-index: 100; color: #ffd700; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #001c3d; transition: 0.4s; z-index: 99; padding-top: 80px; border-right: 2px solid #ffd700; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 18px; color: white; display: flex; align-items: center; border-bottom: 1px solid #003366; margin: 5px 10px; border-radius: 12px; transition: 0.2s; }
        .sidebar a:active { background: #003366; transform: scale(0.98); }
        .icon-box { margin-right: 15px; font-size: 22px; }

        /* Лига ва Танга */
        .league-container { margin-top: 90px; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #coinCount { font-size: 60px; color: #ffd700; margin-top: 10px; font-weight: bold; text-shadow: 0 0 20px rgba(255,215,0,0.4); }
        
        .coin-container { margin-top: 30px; }
        #clicker { width: 240px; height: 240px; background: radial-gradient(circle, #ffcc33, #cc9900); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 110px; color: #663300; font-weight: bold; border: 10px solid #e6b800; cursor: pointer; transition: transform 0.1s; user-select: none; -webkit-tap-highlight-color: transparent; box-shadow: 0 0 40px rgba(255,204,51,0.3); }
        #clicker:active { transform: scale(0.92); }
        
        .instruction { font-size: 18px; color: #ffd700; margin-top: 25px; font-weight: 500; }

        /* Модал (Окно) */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #001c3d; padding: 25px; border-radius: 20px; width: 85%; z-index: 101; border: 2px solid #ffd700; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #ffd700; background: #000; color: white; font-size: 16px; }
        .save-btn { background: #ffd700; color: black; padding: 12px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="menu-icon" onclick="toggleSidebar()">☰</div>

    <div class="sidebar" id="sidebar">
        <a href="#" onclick="showModal('walletModal')"><span class="icon-box">👛</span> Ҳамён</a>
        <a href="#" onclick="buyAutoBot()"><span class="icon-box">🤖</span> Автобот</a>
        <a href="#" onclick="inviteFriend()"><span class="icon-box">👥</span> Даъвати дӯст</a>
        <a href="#" onclick="toggleSidebar()" style="margin-top: 50px; background: #4a0000; color: #ff8888;"><span class="icon-box">❌</span> Пӯшидан</a>
    </div>

    <div class="league-container" id="leagueBox">
        <span id="leagueName">Bronze</span>
    </div>

    <div id="coinCount">0</div>

    <div class="coin-container">
        <div id="clicker">D</div>
    </div>
    <div class="instruction">Зер кун ва пул ба даст ор!</div>

    <div id="walletModal" class="modal">
        <h3 style="margin-top:0; color:#ffd700;">Ҳамёни TON</h3>
        <p style="font-size:14px; color:#ccc;">Суроғаро барои гирифтани маблағ ворид кунед:</p>
        <input type="text" id="walletAddr" placeholder="UQ... ё EQ...">
        <button class="save-btn" onclick="saveWallet()">ЗАХИРА КАРДАН</button>
        <p onclick="closeModal('walletModal')" style="margin-top:15px; cursor:pointer; color:#ff4444;">Бақия</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBM9eh6zH_u0mk4G8YdZdyu0QFnw5bkbCI",
            authDomain: "dilik-game.firebaseapp.com",
            databaseURL: "https://dilik-game-default-rtdb.firebaseio.com",
            projectId: "dilik-game",
            storageBucket: "dilik-game.firebasestorage.app",
            messagingSenderId: "354871648694",
            appId: "1:354871648694:web:37372e8ef8dc33eaff2117"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user_test";
        const userRef = database.ref('users/' + userId);
        
        let coins = 0;
        let currentLeague = "Bronze";

        function updateLeague(amt) {
            let newLeague = "Bronze";
            let color = "#cd7f32";

            if (amt >= 150000) { newLeague = "Platinum"; color = "#e5e4e2"; }
            else if (amt >= 80000) { newLeague = "Gold"; color = "#ffd700"; }
            else if (amt >= 30000) { newLeague = "Silver"; color = "#c0c0c0"; }

            if (newLeague !== currentLeague) {
                currentLeague = newLeague;
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                tg.HapticFeedback.notificationOccurred('success');
                alert("Табрик! Шумо ба лигаи " + newLeague + " гузаштед! 🎉");
            }

            document.getElementById('leagueName').innerText = newLeague;
            document.getElementById('leagueBox').style.color = color;
        }

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                coins = data.coins || 0;
                document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
                updateLeague(coins);
                if (data.wallet) document.getElementById('walletAddr').value = data.wallet;
            }
        });

        document.getElementById('clicker').onclick = () => {
            coins++;
            document.getElementById('coinCount').innerText = Math.floor(coins).toLocaleString();
            updateLeague(coins);
            userRef.update({ coins: coins });
            tg.HapticFeedback.impactOccurred('medium');
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function showModal(id) { document.getElementById(id).style.display = 'block'; toggleSidebar(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function saveWallet() {
            const addr = document.getElementById('walletAddr').value;
            userRef.update({ wallet: addr });
            alert("Ҳамён бо муваффақият пайваст шуд!");
            closeModal('walletModal');
        }

        function buyAutoBot() {
            if (coins >= 1000) {
                coins -= 1000;
                userRef.update({ coins: coins, hasBot: true });
                alert("Боти худкор фаъол шуд! 🤖");
            } else { alert("Маблағ барои бот (1000 танга) кифоя нест!"); }
        }

        function inviteFriend() {
            const link = "https://t.me/Dilik_gold_bot?start=" + userId;
            tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent("Бо ман дар Dilik Gold танга ҷамъ кун!"));
        }
    </script>
</body>
</html>
