<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dilik Gold Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; outline: none; }
        body { background: #000b1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #turboTimerDisplay { color: #ff4444; font-size: 18px; font-weight: bold; margin-top: 5px; display: none; text-shadow: 0 0 8px rgba(255, 68, 68, 0.6); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .click-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #clicker { width: 220px; height: 220px; background: radial-gradient(circle, #ffcc33 0%, #cc9900 100%); border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 90px; color: #663300; font-weight: bold; border: 10px solid #e6b800; box-shadow: 0 0 40px rgba(255, 215, 0, 0.2); cursor: pointer; transition: transform 0.05s; z-index: 5; }
        #clicker:active { transform: scale(0.92); }
        
        #loader { width: 80px; height: 80px; border: 8px solid #002b5c; border-top: 8px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #00152e; transition: 0.3s; z-index: 1000; border-right: 2px solid #ffd700; padding-top: 50px; }
        .sidebar.active { left: 0; }
        .sidebar a { padding: 18px 25px; text-decoration: none; font-size: 17px; color: #e0e0e0; display: block; border-bottom: 1px solid #002b5c; cursor: pointer; text-align: left; }
        
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #001c3d; padding: 25px; border-radius: 25px; width: 85%; z-index: 1100; border: 2px solid #ffd700; max-height: 80vh; overflow-y: auto; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1050; }
        .btn-gold { background: linear-gradient(180deg, #ffd700, #b8860b); color: #000; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        
        /* ИСЛОҲИ АНИМАТСИЯИ ТАП */
        .tap-number { position: absolute; color: #ffd700; font-size: 35px; font-weight: 900; pointer-events: none; animation: moveUp 0.8s ease-out forwards; z-index: 100; }
        @keyframes moveUp { 
            0% { opacity: 1; transform: translateY(0); } 
            100% { opacity: 0; transform: translateY(-120px); } 
        }
        
        #ad-banner { display: none; background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 10px; margin: 10px; border-radius: 10px; color: #ffd700; font-weight: bold; }
        .skin-box { background: #002b5c; padding: 10px; border-radius: 15px; border: 1px solid #ffd700; }

        .wheel-wrapper { position: relative; width: 260px; height: 260px; margin: 20px auto; }
        #wheel-container { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #ffd700; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); background: #cc9900; }
        .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 30px; background: #ff4444; clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 20; }
        .segment { position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #000; }
        .segment:nth-child(odd) { background: #ffd700; }
        .segment:nth-child(even) { background: #e6b800; }
    </style>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <a onclick="showM('luckyWheelModal')" style="color:#ffcc00; font-weight:bold;">🎰 Lucky Wheel (5k)</a>
        <a onclick="showLeaderboard()">🏆 Top 10 Players (8k)</a>
        <a onclick="joinChannel()" style="color:#00e5ff">📢 Join Channel (+5k)</a>
        <a onclick="showM('turboModal')" id="turboBtnMenu" style="color:#ff4444">🔥 Turbo Mode (10k)</a>
        <a onclick="showM('skinModal')" style="color:#00ff00">🎨 Skin Shop</a>
        <a onclick="showM('upgradeModal')">🚀 Upgrade Tap</a>
        <a onclick="invite()">👥 Invite Friends</a>
        <a onclick="showM('walletModal')">👛 Wallet (TON)</a>
        <a id="adminLink" onclick="showM('adminModal')" style="display:none; color:#00ff00; font-weight:bold;">🛠 Admin Panel</a>
        <a onclick="toggleS()" style="color:#ff4444; margin-top: 20px;">❌ Close</a>
    </div>

    <div style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 35px;" onclick="toggleS()">☰</span>
            <span style="background: #ffd700; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold;">PLATINUM LEAGUE</span>
            <span></span>
        </div>
        <div id="ad-banner"></div>
        <div id="balance" style="font-size: 45px; color: #ffd700; font-weight: bold; margin-top: 10px;">WAIT...</div>
        <div id="turboTimerDisplay"></div>
    </div>

    <div class="click-area">
        <div id="loadingContainer"><div id="loader"></div></div>
        <div id="clicker" onclick="handleTap(event)">D</div>
    </div>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="luckyWheelModal" class="modal">
        <h2>🎰 LUCKY WHEEL</h2>
        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <div id="wheel-container">
                <div class="segment" style="transform: rotate(0deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">1M</span></div>
                <div class="segment" style="transform: rotate(45deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">0</span></div>
                <div class="segment" style="transform: rotate(90deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">5k</span></div>
                <div class="segment" style="transform: rotate(135deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">500</span></div>
                <div class="segment" style="transform: rotate(180deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">50k</span></div>
                <div class="segment" style="transform: rotate(225deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">0</span></div>
                <div class="segment" style="transform: rotate(270deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">10k</span></div>
                <div class="segment" style="transform: rotate(315deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22.5deg); margin-left: 40px;">2k</span></div>
            </div>
        </div>
        <button id="spinBtn" class="btn-gold" onclick="spinWheel()">SPIN (5,000)</button>
        <button class="btn-gold" style="background:#444; color:#fff;" onclick="closeAll()">CLOSE</button>
    </div>

    <div id="turboModal" class="modal"><h2>🔥 TURBO</h2><button id="buyTurboBtn" class="btn-gold" onclick="buyTurbo()">ACTIVATE</button><button class="btn-gold" style="background:#444;" onclick="closeAll()">CLOSE</button></div>
    <div id="skinModal" class="modal"><h2>🎨 SKINS</h2><div id="skinGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div><button class="btn-gold" style="background:#444;" onclick="closeAll()">CLOSE</button></div>
    <div id="upgradeModal" class="modal"><h2>🚀 UPGRADE</h2><p>Level: <b id="lvlNow">1</b></p><button id="upBtn" class="btn-gold" onclick="doUpgrade()">UPGRADE</button><button class="btn-gold" style="background:#444;" onclick="closeAll()">BACK</button></div>
    <div id="adminModal" class="modal"><h2>🛠 ADMIN</h2><textarea id="adMsg" style="width:100%;height:50px;"></textarea><button class="btn-gold" onclick="sendAd()">SEND</button><button class="btn-gold" onclick="clearAd()" style="background:#f44;">DELETE AD</button><button class="btn-gold" onclick="add100k()" style="background:#222;">+100K</button><button class="btn-gold" style="background:#444;" onclick="closeAll()">BACK</button></div>
    <div id="walletModal" class="modal"><h2>👛 WALLET</h2><input type="text" id="walletInput" style="width:100%;padding:10px;"><button class="btn-gold" onclick="saveWallet()">SAVE</button></div>
    <div id="leaderboardModal" class="modal"><h2>🏆 TOP 10</h2><div id="leaderList"></div><button class="btn-gold" style="background:#444;" onclick="closeAll()">CLOSE</button></div>

    <script>
        const tg = window.Telegram.WebApp;
        const ADMIN_ID = 5863448768;
        firebase.initializeApp({ databaseURL: "https://dilik-game-default-rtdb.firebaseio.com" });
        const uId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "local_user";
        const uRef = firebase.database().ref('users/' + uId);
        const globalRef = firebase.database().ref('global_config');

        let data = { coins: 0, tapLvl: 0, turboEnd: 0, activeSkin: "D", ownedSkins: ["D"], wallet: "", lastLeaderboardPayDate: "", joinedChannel: false };
        let isReady = false;

        uRef.on('value', s => {
            if(s.val()) data = {...data, ...s.val()}; else uRef.set(data);
            isReady = true;
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('clicker').style.display = 'flex';
            updateUI();
        });

        globalRef.on('value', s => {
            const g = s.val(); const banner = document.getElementById('ad-banner');
            if(g && g.ad_text) { banner.innerText = "📢 " + g.ad_text; banner.style.display = 'block'; }
            else { banner.style.display = 'none'; }
        });

        function updateUI() {
            if(!isReady) return;
            document.getElementById('balance').innerText = Math.floor(data.coins).toLocaleString();
            document.getElementById('clicker').innerText = data.activeSkin;
            document.getElementById('lvlNow').innerText = data.tapLvl + 1;
            if(uId == ADMIN_ID) document.getElementById('adminLink').style.display = 'block';
            renderSkins();
            checkTurboStatus();
        }

        function checkTurboStatus() {
            const now = Date.now();
            const timerDiv = document.getElementById('turboTimerDisplay');
            if (data.turboEnd && now < data.turboEnd) {
                let diff = data.turboEnd - now;
                let min = Math.floor(diff / 60000); let sec = Math.floor((diff % 60000) / 1000);
                timerDiv.innerText = `🔥 TURBO: ${min}:${sec < 10 ? '0' : ''}${sec}`;
                timerDiv.style.display = 'block';
                document.getElementById('turboBtnMenu').innerText = `🔥 Active (${min}m)`;
            } else {
                timerDiv.style.display = 'none';
                document.getElementById('turboBtnMenu').innerText = "🔥 Turbo Mode (10k)";
            }
        }

        function handleTap(e) {
            if(!isReady) return;
            const gain = (1 + data.tapLvl) + (Date.now() < data.turboEnd ? 5 : 0);
            data.coins += gain;
            uRef.update({ coins: data.coins, name: tg.initDataUnsafe.user?.first_name || "User" });
            
            // АНИМАТСИЯИ ТАП - ИСЛОҲ ШУД
            const n = document.createElement('div');
            n.className = 'tap-number';
            n.innerText = `+${gain}`;
            
            // Муайян кардани ҷойгоҳи дақиқ дар рӯи экран
            n.style.left = `${e.clientX - 20}px`;
            n.style.top = `${e.clientY - 40}px`;
            
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 800);
            
            tg.HapticFeedback.impactOccurred('light');
        }

        function spinWheel() {
            if (data.coins < 5000) { alert("Not enough coins!"); return; }
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            data.coins -= 5000;
            uRef.update({ coins: data.coins });

            const wheel = document.getElementById('wheel-container');
            const randomRotation = 1800 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${randomRotation}deg)`;

            setTimeout(() => {
                let winAmount = 0;
                let chance = Math.random() * 100;
                if (uId == ADMIN_ID) {
                    if (chance > 80) winAmount = 1000000; else winAmount = 10000;
                } else {
                    if (chance > 60) winAmount = 0; else if (chance > 20) winAmount = 500; else winAmount = 2500; 
                }
                data.coins += winAmount;
                uRef.update({ coins: data.coins });
                alert(winAmount > 0 ? `You won ${winAmount.toLocaleString()} coins!` : "No luck!");
                wheel.style.transition = "none";
                wheel.style.transform = "rotate(0deg)";
                setTimeout(() => wheel.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)", 50);
                btn.disabled = false;
                updateUI();
            }, 4000);
        }

        function sendAd() { const msg = document.getElementById('adMsg').value; if(msg.trim()) globalRef.update({ ad_text: msg }); }
        function clearAd() { globalRef.update({ ad_text: "" }); alert("Ad deleted!"); }
        function showLeaderboard() { const now = new Date(); const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate(); if (data.lastLeaderboardPayDate === todayStr) loadAndShowLeaderboard(); else if (confirm("View Top 10 costs 8,000?")) { if (data.coins >= 8000) { data.coins -= 8000; data.lastLeaderboardPayDate = todayStr; uRef.update({ coins: data.coins, lastLeaderboardPayDate: todayStr }); loadAndShowLeaderboard(); } } }
        function loadAndShowLeaderboard() { showM('leaderboardModal'); firebase.database().ref('users').orderByChild('coins').limitToLast(10).once('value', s => { let l = ""; let players = []; s.forEach(c => { players.push(c.val()); }); players.reverse().forEach((p, i) => { let r = i===0?"🥇":i===1?"🥈":i===2?"🥉":""; l += `<div style="padding:8px; border-bottom:1px solid #333">${i+1}. ${p.name || 'User'}: ${Math.floor(p.coins).toLocaleString()} ${r}</div>`; }); document.getElementById('leaderList').innerHTML = l; }); }
        function buyTurbo() { if(data.coins >= 10000) { data.coins -= 10000; data.turboEnd = Date.now() + 3600000; uRef.update({ coins: data.coins, turboEnd: data.turboEnd }); closeAll(); } }
        function joinChannel() { tg.openTelegramLink("https://t.me/DILIK_officia"); if(!data.joinedChannel) { data.coins += 5000; data.joinedChannel = true; uRef.update({ coins: data.coins, joinedChannel: true }); } }
        function renderSkins() { 
            const skins = [{id: "D", p: 0}, {id: "₿", p: 50000}, {id: "💎", p: 100000}, {id: "🥇", p: 25000}, {id: "🥈", p: 10000}, {id: "🚀", p: 75000}, {id: "🔥", p: 40000}, {id: "🌟", p: 20000}, {id: "💰", p: 15000}, {id: "👑", p: 90000}, {id: "🍎", p: 30000}, {id: "⚡", p: 55000}];
            let h = ""; skins.forEach(s => { const isO = data.ownedSkins.includes(s.id); h += `<div class="skin-box"><div style="font-size:30px">${s.id}</div><button class="btn-gold" style="padding:5px;font-size:10px" onclick="${isO ? `setS('${s.id}')` : `buyS('${s.id}',${s.p})`}">${isO ? (data.activeSkin==s.id?'ACTIVE':'USE') : s.p}</button></div>`; }); document.getElementById('skinGrid').innerHTML = h; 
        }
        function buyS(i, p) { if(data.coins >= p) { let o = [...data.ownedSkins, i]; uRef.update({coins: data.coins - p, ownedSkins: o}); } }
        function setS(i) { uRef.update({activeSkin: i}); }
        function doUpgrade() { const costs = [3000, 8000, 15000, 25000, 45000]; if(data.tapLvl < 5 && data.coins >= costs[data.tapLvl]) uRef.update({ coins: data.coins - costs[data.tapLvl], tapLvl: data.tapLvl + 1 }); }
        function add100k() { uRef.update({ coins: data.coins + 100000 }); }
        function toggleS() { document.getElementById('sidebar').classList.toggle('active'); }
        function showM(id) { closeAll(); document.getElementById('overlay').style.display='block'; document.getElementById(id).style.display='block'; if(document.getElementById('sidebar').classList.contains('active')) toggleS(); }
        function closeAll() { document.getElementById('overlay').style.display='none'; const m = document.getElementsByClassName('modal'); for(let x of m) x.style.display='none'; }
        function saveWallet() { uRef.update({ wallet: document.getElementById('walletInput').value }); alert("Saved!"); }
        function invite() { tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/Dilik_gold_bot?start=${uId}&text=Join and Earn!`); }
        
        tg.expand();
        setInterval(checkTurboStatus, 1000);
    </script>
</body>
</html>
